name: Validate source and offline bundle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - run: npm test
      - run: node bin/breakglassmap.mjs validate examples/identity-outage.json
      - run: node bin/breakglassmap.mjs analyze examples/identity-outage.json --scenario identity-outage --fail-on none --format json
      - run: git diff --exit-code -- dist/BreakGlassMap.html
